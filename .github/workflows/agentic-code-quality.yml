name: Agentic Code Quality & SOLID Principles Enforcement

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/agentic-code-quality.yml'
  push:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'

jobs:
  code-quality-analysis:
    runs-on: ubuntu-latest
    name: Code Quality & SOLID Analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Run StyleCop Analyzers
        run: |
          dotnet build --no-restore --configuration Release \
            /p:TreatWarningsAsErrors=true \
            /p:EnforceCodeStyleInBuild=true \
            2>&1 | tee stylecop-report.log
        continue-on-error: true

      - name: Run Code Metrics & Complexity Analysis
        run: |
          dotnet add package Microsoft.CodeAnalysis.NetAnalyzers --version 9.0.0 2>/dev/null || true
          dotnet build --no-restore --configuration Release \
            /p:EnableNETAnalyzers=true \
            /p:AnalysisLevel=latest \
            2>&1 | tee complexity-report.log
        continue-on-error: true

      - name: Run SOLID Principle Violations Check
        run: |
          echo "=== SOLID Principles Analysis ===" > solid-violations.txt
          
          # Single Responsibility Principle - check class size and method complexity
          echo "Checking Single Responsibility Principle violations..." >> solid-violations.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs wc -l | sort -rn | awk '$1 > 300 {print "⚠️ Large class (SRP): " $2 " (" $1 " lines)"}' >> solid-violations.txt
          
          # Dependency Inversion - check for direct instantiation of dependencies
          echo -e "\nChecking Dependency Inversion Principle violations..." >> solid-violations.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "new [A-Z].*Service\|new [A-Z].*Repository\|new [A-Z].*Factory" | \
            head -20 | awk '{print "⚠️ Direct dependency instantiation: " $0}' >> solid-violations.txt
          
          # Interface Segregation - check for large interfaces
          echo -e "\nChecking Interface Segregation Principle violations..." >> solid-violations.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" -exec grep -l "interface.*{" {} \; | \
            while read file; do
              method_count=$(grep -o "^\s*[a-zA-Z].*(.*);" "$file" | wc -l)
              if [ $method_count -gt 5 ]; then
                echo "⚠️ Large interface (ISP): $file ($method_count methods)" >> solid-violations.txt
              fi
            done
          
          cat solid-violations.txt



      - name: Detect Code Smells & Anti-patterns
        run: |
          echo "=== Code Smell Detection ===" > code-smells.txt
          
          # Deep nesting check
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "^\s\{16,\}" | head -10 | awk '{print "⚠️ Deep nesting detected: " $0}' >> code-smells.txt
          
          # Magic numbers check
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -nE "= [0-9]{3,}|if.*[0-9]{3,}" | head -10 | awk '{print "⚠️ Magic number: " $0}' >> code-smells.txt
          
          # Long parameter lists
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "(.*, .*, .*, .*, .*, " | head -10 | awk '{print "⚠️ Long parameter list: " $0}' >> code-smells.txt
          
          cat code-smells.txt

      - name: Architecture Rules Validation
        run: |
          echo "=== Architecture Rules Validation ===" > architecture-report.txt
          
          # Check for circular dependencies
          echo "Checking for circular dependencies..." >> architecture-report.txt
          find . -name "*.csproj" -type f ! -path "*/obj/*" ! -path "*/bin/*" | \
            while read proj; do
              deps=$(grep -o '<ProjectReference.*Include="[^"]*"' "$proj" | wc -l)
              if [ $deps -gt 5 ]; then
                echo "⚠️ High coupling: $proj has $deps dependencies" >> architecture-report.txt
              fi
            done
          
          # Check for proper naming conventions
          echo -e "\nChecking naming conventions..." >> architecture-report.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -E "^[[:space:]]*public [a-z]" | head -5 | awk '{print "⚠️ Naming convention violation: " $0}' >> architecture-report.txt
          
          cat architecture-report.txt

      - name: Generate Quality Report
        if: always()
        run: |
          echo "# Code Quality Report" > quality-report.md
          echo "" >> quality-report.md
          echo "## SOLID Principles Violations" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat solid-violations.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          
          echo "" >> quality-report.md
          echo "## Code Smells Detected" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat code-smells.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          
          echo "" >> quality-report.md
          echo "## Architecture Analysis" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat architecture-report.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          

          
          cat quality-report.md

      - name: Comment on PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quality-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:


      - name: Enforce Quality Gates
        if: always()
        run: |
          BUILD_FAILED=false
          
          # Check for critical SOLID violations
          if grep -q "Direct dependency instantiation" solid-violations.txt && [ $(grep -c "Direct dependency instantiation" solid-violations.txt) -gt 3 ]; then
            echo "❌ Too many DIP violations detected"
            BUILD_FAILED=true
          fi
          
          if [ "$BUILD_FAILED" == "true" ]; then
            echo "❌ Quality gates failed - PR cannot be merged"
            exit 1
          else
            echo "✅ All quality gates passed"
            exit 0
          fi
