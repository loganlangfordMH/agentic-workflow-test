name: Agentic Code Quality & SOLID Principles Enforcement

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/agentic-code-quality-fixed.yml"
  push:
    branches: [main, develop]
    paths:
      - "**.cs"
      - "**.csproj"

jobs:
  code-quality-analysis:
    runs-on: ubuntu-latest
    name: Code Quality & SOLID Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore
        continue-on-error: true

      - name: Build Project
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=false
        continue-on-error: true

      - name: SOLID Principles Analysis
        run: |
          echo "=== SOLID Principles Analysis ===" > solid-violations.txt

          echo "Checking Single Responsibility Principle violations..." >> solid-violations.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs wc -l | sort -rn | awk '$1 > 300 {print "⚠️ Large class (SRP): " $2 " (" $1 " lines)"}' >> solid-violations.txt

          echo "" >> solid-violations.txt
          echo "Checking Dependency Inversion Principle violations..." >> solid-violations.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "new [A-Z].*Service\|new [A-Z].*Repository\|new [A-Z].*Factory" 2>/dev/null | \
            head -20 | awk '{print "⚠️ Direct dependency instantiation: " $0}' >> solid-violations.txt

          echo "" >> solid-violations.txt
          echo "Checking Interface Segregation Principle violations..." >> solid-violations.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" -exec grep -l "interface.*{" {} \; 2>/dev/null | \
            while read file; do
              method_count=$(grep -o "^\s*[a-zA-Z].*(.*);" "$file" 2>/dev/null | wc -l)
              if [ $method_count -gt 5 ]; then
                echo "⚠️ Large interface (ISP): $file ($method_count methods)" >> solid-violations.txt
              fi
            done

          cat solid-violations.txt

      - name: Code Smells Detection
        run: |
          echo "=== Code Smell Detection ===" > code-smells.txt

          echo "Deep nesting check (4+ levels)..." >> code-smells.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "^\s\{16,\}" 2>/dev/null | head -10 | awk '{print "⚠️ Deep nesting detected: " $0}' >> code-smells.txt

          echo "" >> code-smells.txt
          echo "Magic numbers check..." >> code-smells.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -nE "= [0-9]{3,}|if.*[0-9]{3,}" 2>/dev/null | head -10 | awk '{print "⚠️ Magic number: " $0}' >> code-smells.txt

          echo "" >> code-smells.txt
          echo "Long parameter lists check (5+ params)..." >> code-smells.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "(.*, .*, .*, .*, " 2>/dev/null | head -10 | awk '{print "⚠️ Long parameter list: " $0}' >> code-smells.txt

          cat code-smells.txt

      - name: Naming Conventions Check
        run: |
          echo "=== Naming Conventions Analysis ===" > naming-conventions.txt

          echo "Checking interface names (should start with I)..." >> naming-conventions.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "public interface [^I]" 2>/dev/null | head -10 | awk '{print "⚠️ " $0}' >> naming-conventions.txt

          echo "" >> naming-conventions.txt
          echo "Checking for lowercase class names..." >> naming-conventions.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n "^[[:space:]]*public class [a-z]" 2>/dev/null | head -10 | awk '{print "⚠️ " $0}' >> naming-conventions.txt

          cat naming-conventions.txt

      - name: Architecture Analysis
        run: |
          echo "=== Architecture Analysis ===" > architecture-report.txt

          echo "Analyzing project dependencies..." >> architecture-report.txt
          find . -name "*.csproj" -type f ! -path "*/obj/*" ! -path "*/bin/*" | \
            while read proj; do
              deps=$(grep -o '<ProjectReference.*Include="[^"]*"' "$proj" 2>/dev/null | wc -l)
              if [ $deps -gt 5 ]; then
                echo "⚠️ High coupling: $proj has $deps dependencies" >> architecture-report.txt
              fi
            done

          echo "" >> architecture-report.txt
          echo "Checking hardcoded values..." >> architecture-report.txt
          find . -name "*.cs" -type f ! -path "*/obj/*" ! -path "*/.git/*" ! -path "*/bin/*" | \
            xargs grep -n 'const string.*=.*"' 2>/dev/null | head -5 | awk '{print "⚠️ Hardcoded value: " $0}' >> architecture-report.txt

          cat architecture-report.txt

      - name: Generate Quality Report
        if: always()
        run: |
          echo "# Code Quality Report" > quality-report.md
          echo "" >> quality-report.md
          echo "## SOLID Principles Violations" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat solid-violations.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md

          echo "" >> quality-report.md
          echo "## Code Smells Detected" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat code-smells.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md

          echo "" >> quality-report.md
          echo "## Naming Conventions" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat naming-conventions.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md

          echo "" >> quality-report.md
          echo "## Architecture Analysis" >> quality-report.md
          echo "\`\`\`" >> quality-report.md
          cat architecture-report.txt >> quality-report.md
          echo "\`\`\`" >> quality-report.md

          cat quality-report.md

      - name: Comment Report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quality-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            quality-report.md
            solid-violations.txt
            code-smells.txt
            naming-conventions.txt
            architecture-report.txt
          retention-days: 30

      - name: Enforce Quality Gates
        if: always()
        run: |
          BUILD_FAILED=false

          if grep -q "Direct dependency instantiation" solid-violations.txt 2>/dev/null; then
            count=$(grep -c "Direct dependency instantiation" solid-violations.txt)
            if [ $count -gt 3 ]; then
              echo "❌ Too many DIP violations detected: $count"
              BUILD_FAILED=true
            fi
          fi

          if [ "$BUILD_FAILED" == "true" ]; then
            echo "❌ Quality gates failed"
            exit 1
          else
            echo "✅ Quality gates passed"
            exit 0
          fi
